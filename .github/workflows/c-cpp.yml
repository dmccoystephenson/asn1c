name: C/C++ CI

on:
  push:
    branches: [ vlm_master ]
  pull_request:
    branches: [ vlm_master ]

# Cancel superseded runs on the same ref (e.g. when pushing fixups to a PR)
# so we don't burn runner time finishing stale builds.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    permissions:
      contents: read
      pull-requests: write

    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
    - uses: actions/checkout@v4
    - name: enable parallel make
      # Propagate -j<ncpu> to every make invocation below (including the
      # sub-makes spawned by `make distcheck`) via MAKEFLAGS.
      run: echo "MAKEFLAGS=-j$(nproc)" >> "$GITHUB_ENV"
    - name: preconf
      run: autoreconf -ivf
    - name: configure
      run: ./configure
    - name: make
      run: make
    - name: make check
      run: make check || { find . -name 'test-suite.log' | xargs cat; exit 1; }
    - name: make distcheck
      run: make distcheck || { find . -name 'test-suite.log' | xargs cat; exit 1; }
    - name: upload test logs on failure
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: test-logs
        path: |
          **/test-suite.log
          **/*.log
        retention-days: 7
    - name: test PKIX1 example - generate codecs and test all supported formats
      shell: bash
      run: |
        set -euo pipefail
        cd examples/sample.source.PKIX1
        # Generate C codecs from PKIX1 ASN.1 schemas for all supported encoding formats:
        # BER/DER, XER, OER, PER/UPER, APER, JER, CBOR
        make regen-makefile
        # Build the x509dump tool (compiles all generated codecs)
        make x509dump
        # Run full roundtrip tests for all formats with sample files:
        # BER, XER, OER (COER), UPER, APER are all verified with encode/decode roundtrips
        # and fault injection tests.  The sample-Certificate-1.{coer,per,aper} files
        # activate the corresponding check-oer, check-per, check-aper targets.
        make check
        # Test CBOR encoding/decoding roundtrip
        ./x509dump -p Certificate -iber -ocbor sample-Certificate-1.der > /tmp/cert-1.cbor
        test -s /tmp/cert-1.cbor
        ./x509dump -p Certificate -icbor -oxer /tmp/cert-1.cbor > /tmp/cert-1-cbor-xer.xml
        ./x509dump -p Certificate -iber  -oxer sample-Certificate-1.der > /tmp/cert-1-ber-xer.xml
        diff /tmp/cert-1-ber-xer.xml /tmp/cert-1-cbor-xer.xml
        # Test JER encoding (JER decode of PKIX is not supported due to ANY open types)
        ./x509dump -p Certificate -iber -ojer sample-Certificate-1.der > /tmp/cert-1.jer
        test -s /tmp/cert-1.jer
        echo "PKIX1 codec test passed: BER, XER, OER, UPER, APER, CBOR, JER(encode-only) verified"
